\* Bound execution length with --length; queue occupancy is not constrained.
CONSTANTS
    Threads = {"main", "worker1", "worker2", "writer", "reader", "cleaner"}
    Workers = {"worker1", "worker2"}
    Main = "main"
    Writer = "writer"
    Reader = "reader"
    Cleaner = "cleaner"
    Capacity = 1
    RestoreQueue <- EmptyQueue
    SpuriousWakeups = FALSE
INIT WorkloadInit
NEXT Next
\* TypeOK contains variable record-field ranges unsupported by Apalache.
INVARIANTS WorkloadTypeOK Conservation DiskSafety DeadlockFree
CHECK_DEADLOCK FALSE
