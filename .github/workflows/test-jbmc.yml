name: Install JBMC

on:
  push:
    paths:
      - '.github/workflows/test-jbmc.yml'
  pull_request:
    paths:
      - '.github/workflows/test-jbmc.yml'

jobs:
  install-jbmc:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 11
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install JBMC
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo diffblue/cbmc --pattern 'ubuntu-24.04-cbmc-*-Linux.deb'
          sudo apt-get install --yes ./ubuntu-24.04-cbmc-*-Linux.deb

      - name: Verify JBMC installation
        run: ant -f tlatools/org.lamport.tlatools/customBuild.xml test-jbmc
