  push:
    paths:
      - '.github/workflows/test-jcstress.yml'
      - 'tlatools/org.lamport.tlatools/customBuild.xml'
      - 'tlatools/org.lamport.tlatools/src/tlc2/util/Context.java'
      - 'tlatools/org.lamport.tlatools/src/tlc2/util/FP64.java'
      - 'tlatools/org.lamport.tlatools/src/tlc2/value/impl/EnumerableValue.java'
      - 'tlatools/org.lamport.tlatools/src/tlc2/value/impl/FcnLambdaValue.java'
