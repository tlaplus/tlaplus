name: TLC Lincheck Tests
# It's run whenever the tested classes are updated.

on:
  push:
    paths:
      - '.github/workflows/test-lincheck.yml'
      - 'tlatools/org.lamport.tlatools/customBuild.xml'
      - 'tlatools/org.lamport.tlatools/src/tlc2/module/**'
      - 'tlatools/org.lamport.tlatools/src/tlc2/util/**'
      - 'tlatools/org.lamport.tlatools/src/tlc2/value/**'
      - 'tlatools/org.lamport.tlatools/test-lincheck/**'
  pull_request:
    paths:
      - '.github/workflows/test-lincheck.yml'
      - 'tlatools/org.lamport.tlatools/customBuild.xml'
      - 'tlatools/org.lamport.tlatools/src/tlc2/module/**'
      - 'tlatools/org.lamport.tlatools/src/tlc2/util/**'
      - 'tlatools/org.lamport.tlatools/src/tlc2/value/**'
      - 'tlatools/org.lamport.tlatools/test-lincheck/**'

jobs:
  run-tlc-test-lincheck:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The jgit task nested in customBuild.xml requires repository history.
          fetch-depth: '0'

      # Lincheck cannot read the class files of the newest JDKs.
      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Lincheck
        working-directory: tlatools/org.lamport.tlatools
        run: mvn --batch-mode -f test-lincheck/pom.xml dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=$PWD/target/lincheck/lib

      - name: Run TLC Lincheck tests
        run: ant -f tlatools/org.lamport.tlatools/customBuild.xml info test-lincheck
