name: TLC JPF Tests
# These test take a long time to run (> 6 hours on GitHub ci).
# It's run whenever the tested classes are updated.

on:
  push:
    paths:
      - '.github/workflows/test-jpf.yml'
      - 'tlatools/org.lamport.tlatools/src/tlc2/tool/fp/OffHeapDiskFPSet.java'
      - 'tlatools/org.lamport.tlatools/src/tlc2/tool/queue/StateQueue.java'
      - 'tlatools/org.lamport.tlatools/src/tlc2/tool/queue/DiskStateQueue.java'
      - 'tlatools/org.lamport.tlatools/src/tlc2/util/StatePoolReader.java'
      - 'tlatools/org.lamport.tlatools/src/tlc2/util/StatePoolWriter.java'
      - 'tlatools/org.lamport.tlatools/test-verify/**'
      - 'tlatools/org.lamport.tlatools/test-verify-model/**'
  pull_request:
    paths:
      - '.github/workflows/test-jpf.yml'
      - 'tlatools/org.lamport.tlatools/src/tlc2/tool/fp/OffHeapDiskFPSet.java'
      - 'tlatools/org.lamport.tlatools/src/tlc2/tool/queue/StateQueue.java'
      - 'tlatools/org.lamport.tlatools/src/tlc2/tool/queue/DiskStateQueue.java'
      - 'tlatools/org.lamport.tlatools/src/tlc2/util/StatePoolReader.java'
      - 'tlatools/org.lamport.tlatools/src/tlc2/util/StatePoolWriter.java'
      - 'tlatools/org.lamport.tlatools/test-verify/**'
      - 'tlatools/org.lamport.tlatools/test-verify-model/**'

jobs:
  run-tlc-test-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          # Number of commits to fetch. 0 indicates all history.
          # jgit task nested in customBuild.xml fails without history.
          fetch-depth: '0'

      - name: Set up JDK 11
        uses: actions/setup-java@v1
        with:
          java-version: '11'

      - name: Run TLC test verify
        run: ant -f tlatools/org.lamport.tlatools/customBuild.xml -Dtest.halt=true compile compile-test test-verify info
